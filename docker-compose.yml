services:
  postgres:
    # postgis/postgis is the official postgres:16 image plus the PostGIS
    # extension pre-installed — plain postgres:16-alpine doesn't ship it, so
    # `CREATE EXTENSION postgis` (run automatically by TypeORM/migrations)
    # fails against that image.
    image: postgis/postgis:16-3.4
    container_name: geo-ranao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-georanao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-georanao_dev_password}
      POSTGRES_DB: ${DB_NAME:-geo_ranao}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - geo_ranao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-georanao} -d ${DB_NAME:-geo_ranao}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geo_ranao_pgdata:
